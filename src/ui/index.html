<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font: 12px/1.4 Inter, system-ui, sans-serif; color: var(--figma-color-text, #000); background: var(--figma-color-bg, #fff); }
      #root { display: flex; flex-direction: column; height: 100%; }
      header { padding: 12px 16px; border-bottom: 1px solid var(--figma-color-border, #e6e6e6); }
      header h1 { margin: 0; font-size: 13px; font-weight: 600; }
      header p { margin: 2px 0 0; color: var(--figma-color-text-secondary, #666); }
      main { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
      footer { padding: 12px 16px; border-top: 1px solid var(--figma-color-border, #e6e6e6); display: flex; gap: 8px; align-items: center; }
      button { font: inherit; border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--figma-color-border, #e6e6e6);
        background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #000); }
      button.primary { background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); border-color: transparent; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.link { border: none; padding: 0; background: none; color: var(--figma-color-text-brand, #0d99ff); }
      .muted { color: var(--figma-color-text-secondary, #666); }
      .error { color: var(--figma-color-text-danger, #f24822); }
      .card { border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 8px; padding: 10px 12px; }
      .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .totals .num { font-size: 18px; font-weight: 600; }
      ul.rows { list-style: none; margin: 0; padding: 0; }
      ul.rows > li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--figma-color-border, #e6e6e6); }
      ul.rows .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tag { font-size: 11px; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
      .tag.foreign { background: #fff3cd; color: #b48200; }
      .tag.local { background: #fddede; color: #c0392b; }
      .tag.ours { background: #d6ede1; color: #238c58; }
      h2 { margin: 4px 0 0; font-size: 12px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
